plugins {
    alias(libs.plugins.android.application)
}

def releaseSigningFile = rootProject.file("release-signing.properties")
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword", "apiBaseUrl"].each { name ->
        if (!releaseSigning.getProperty(name)?.trim()) {
            throw new GradleException("Missing ${name} in release-signing.properties")
        }
    }
    if (!rootProject.file(releaseSigning.getProperty("storeFile")).isFile()) {
        throw new GradleException("Release signing keystore is missing")
    }
}

android {
    namespace = "com.example.javareportingsystem"
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId = "com.example.javareportingsystem"
        minSdk = 25
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    signingConfigs {
        localRelease {
            if (releaseSigningFile.isFile()) {
                storeFile rootProject.file(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            // Emulator by default; override for a phone on the same local network.
            resValue "string", "api_base_url", providers.gradleProperty("mineSafeApiBaseUrl")
                    .orElse("http://10.0.2.2:5080").get()
        }
        release {
            signingConfig signingConfigs.localRelease
            resValue "string", "api_base_url", providers.gradleProperty("mineSafeReleaseApiBaseUrl")
                    .orElse(releaseSigning.getProperty("apiBaseUrl", "")).get()
            optimization {
                enable = false
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding = true
        resValues = true
    }
    sourceSets {
        androidTest.assets.srcDirs += ["schemas"]
    }
}

dependencies {
    implementation(libs.room.runtime)
    annotationProcessor(libs.room.compiler)
    implementation(libs.activity.ktx)
    implementation(libs.annotation)
    implementation(libs.appcompat)
    implementation(libs.constraintlayout)
    implementation(libs.lifecycle.livedata.ktx)
    implementation(libs.lifecycle.viewmodel.ktx)
    implementation(libs.material)
    implementation(libs.work.runtime)
    testImplementation(libs.junit)
    androidTestImplementation(libs.espresso.core)
    androidTestImplementation(libs.ext.junit)
}
